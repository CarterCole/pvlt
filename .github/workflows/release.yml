name: release
# On a version tag (v0.1.0, ...): run CI on the tagged commit, then publish the server image to GitHub Container
# Registry (with an SBOM and provenance, signed with Sigstore) and the crates to crates.io. Nothing is published
# unless CI passes. The crates job needs a CARGO_REGISTRY_TOKEN repository secret.
on:
  push:
    tags: ["v*"]
# Nothing by default; each job asks for what it needs.
permissions: {}
jobs:
  ci:
    permissions: { contents: read }
    uses: ./.github/workflows/ci.yml

  image:
    needs: ci
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write # push to ghcr.io
      id-token: write # keyless Sigstore signing
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - uses: docker/login-action@8aa5831fb8d48d8f76594c7ddde61ae58019f550 # v4.8.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        with:
          images: ghcr.io/${{ github.repository }}
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=raw,value=latest
      - id: build
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          sbom: true
          provenance: mode=max
          cache-from: type=gha
          cache-to: type=gha,mode=max
      # Installs cosign v3, which stores the signature as a Sigstore bundle attached to the image as an OCI referrer
      # (on GHCR, which has no referrers API, under the sha256-<digest> fallback tag). Verifying it needs cosign v3;
      # images up to 0.2.0 were signed by cosign v2 in the older .sig format.
      - uses: sigstore/cosign-installer@756fe2d284c7292c4e9b62c8a28f1e5629c59532 # v4.1.3
      - name: sign the image by digest
        shell: bash
        env:
          IMAGE: ghcr.io/${{ github.repository }}
          DIGEST: ${{ steps.build.outputs.digest }}
        # An image reference must be lower case; the repository is CarterCole/pvlt. metadata-action lowercases the
        # tags it pushes, so sign the same name.
        run: cosign sign --yes "${IMAGE,,}@${DIGEST}"

  crates:
    needs: ci
    runs-on: ubuntu-latest
    permissions: { contents: read }
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dtolnay/rust-toolchain@df2a88e9fe4098bad09cb42c3dec7187f15861fc # master
        with: { toolchain: stable }
      - name: the tag matches the crate version
        run: |
          v=$(cargo metadata --no-deps --format-version 1 | python3 -c 'import json,sys; print(json.load(sys.stdin)["packages"][0]["version"])')
          [ "v$v" = "${GITHUB_REF_NAME}" ] || { echo "tag ${GITHUB_REF_NAME} does not match version $v"; exit 1; }
      - name: skip when this version is already on crates.io
        id: published
        run: |
          v="${GITHUB_REF_NAME#v}"
          code=$(curl -s -o /dev/null -w '%{http_code}' -A "pvlt-release" "https://crates.io/api/v1/crates/pvlt-server/$v")
          echo "already=$([ "$code" = 200 ] && echo true || echo false)" >> "$GITHUB_OUTPUT"
      - if: steps.published.outputs.already != 'true'
        run: cargo publish --workspace --locked
        env:
          CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}
