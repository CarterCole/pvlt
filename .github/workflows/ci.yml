name: ci
on: [push, pull_request]
permissions: { contents: read }
env: { CARGO_TERM_COLOR: always }
jobs:
  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17
        env: { POSTGRES_PASSWORD: pvlt, POSTGRES_DB: pvlt }
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres" --health-interval 5s --health-retries 10
    env:
      PVLT_TEST_DATABASE_URL: postgres://postgres:pvlt@localhost:5432/pvlt
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with: { components: "rustfmt, clippy" }
      - uses: astral-sh/setup-uv@v5
      - uses: actions/setup-node@v4
        with: { node-version: 24 }
      - run: cargo fmt --all --check
      - run: cargo clippy --workspace --all-targets --locked -- -D warnings
      - run: cargo clippy --workspace --all-targets --locked --features pvlt-server/dev-insecure -- -D warnings
      - run: cargo test --workspace --locked -- --include-ignored
      - name: default binary has no dev-insecure symbols
        run: |
          cargo build --release --locked -p pvlt-server
          if strings target/release/pvlt | grep -q "insecure-dev-listener"; then echo "dev-insecure code present"; exit 1; fi
      - run: (cd spec/reference && uv run gen_vectors.py --check)
      - run: (cd clients/typescript && node --test test/*.test.ts)
      - run: (cd clients/python && python3 -m unittest -v)
  msrv:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@1.90
      - run: cargo check --workspace --locked
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: EmbarkStudios/cargo-deny-action@v2
