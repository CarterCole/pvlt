# An example for trying pvlt locally. It is NOT a production deployment: the passwords are placeholders, MinIO
# and Postgres have no TLS, and the vault needs secrets and certificates in ./secrets (see docs/RUNNING.md).
services:
  postgres:
    image: postgres:17
    environment:
      POSTGRES_PASSWORD: change-me
      POSTGRES_DB: pvlt
    volumes: ["pgdata:/var/lib/postgresql/data"]
  minio:
    image: minio/minio
    command: server /data
    environment:
      MINIO_ROOT_USER: change-me-user
      MINIO_ROOT_PASSWORD: change-me-password
    volumes: ["objects:/data"]
  pvlt:
    build: .
    depends_on: [postgres, minio]
    ports: ["8443:8443"]
    volumes: ["./secrets:/secrets:ro"]
    environment:
      PVLT_DATABASE_URL: postgres://postgres:change-me@postgres/pvlt
      PVLT_DOMAIN: 00000000-0000-4000-8000-000000000001
      PVLT_S3_BUCKET: pvlt
      PVLT_S3_ENDPOINT: http://minio:9000
      PVLT_S3_PATH_STYLE: "true"
      PVLT_S3_ALLOW_HTTP: "true"
      PVLT_S3_ACCESS_KEY_ID_FILE: /secrets/s3_key_id
      PVLT_S3_SECRET_ACCESS_KEY_FILE: /secrets/s3_secret
      PVLT_TLS_CERT: /secrets/cert.pem
      PVLT_TLS_KEY: /secrets/key.pem
      PVLT_ADMIN_LISTEN: 0.0.0.0:8444
      PVLT_ADMIN_TOKENS_FILE: /secrets/admins
volumes: { pgdata: {}, objects: {} }
