[workspace]
resolver = "3"
members = ["crates/pvlt-format", "crates/pvlt-mem", "crates/pvlt-core", "crates/pvlt-policy", "crates/pvlt-server"]

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.94"
license = "Apache-2.0"
repository = "https://github.com/CarterCole/pvlt"
homepage = "https://github.com/CarterCole/pvlt"
keywords = ["pii", "encryption", "crypto-shredding", "privacy", "vault"]
categories = ["cryptography"]

[workspace.lints.rust]
unsafe_code = "forbid"
missing_docs = "warn"

[workspace.lints.clippy]
unwrap_used = "deny"
expect_used = "deny"
indexing_slicing = "deny"
dbg_macro = "deny"
panic = "deny"
todo = "deny"

[profile.release]
overflow-checks = true
