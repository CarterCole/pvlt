[advisories]
version = 2
# RUSTSEC-2026-0387 (crypto-bigint 0.5.5): fixed only in 0.7.6, but elliptic-curve 0.13 (under biscuit-auth's and
# age's P-256 support) requires ^0.5, so it cannot be updated here. pvlt never does secret P-256 arithmetic:
# tokens use Ed25519 keys and backups use X25519 recipients. Revisit when biscuit-auth or age move to a newer
# elliptic-curve.
ignore = ["RUSTSEC-2026-0387"]

[licenses]
version = 2
allow = ["MIT", "Apache-2.0", "Apache-2.0 WITH LLVM-exception", "BSD-2-Clause", "BSD-3-Clause", "ISC",
         "Unicode-3.0", "Zlib", "CC0-1.0", "MPL-2.0", "OpenSSL", "CDLA-Permissive-2.0"]

[bans]
multiple-versions = "warn"
wildcards = "deny"

[sources]
unknown-registry = "deny"
unknown-git = "deny"
