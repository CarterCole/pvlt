[package]
name = "pvlt-objects"
description = "Object store for pvlt on S3-compatible buckets, a local directory, or memory."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
keywords.workspace = true
categories = ["filesystem", "cryptography"]
readme = "README.md"

[dependencies]
pvlt-core = { path = "../pvlt-core", version = "0.1.0" }
pvlt-format = { path = "../pvlt-format", version = "0.1.0" }
object_store = { version = "0.14", default-features = false, features = ["aws", "fs"] }
futures = "0.3"
time = { version = "0.3", default-features = false, features = ["std"] }

[dev-dependencies]
pvlt-mem = { path = "../pvlt-mem", version = "0.1.0" }
tokio = { version = "1", features = ["rt-multi-thread", "macros", "time"] }

[lints]
workspace = true
