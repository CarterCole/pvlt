[package]
name = "pvlt-mem"
description = "Locked, guard-paged key memory and process hardening for pvlt. The only pvlt crate with unsafe code."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
keywords.workspace = true
categories = ["memory-management", "cryptography"]
readme = "README.md"

[dependencies]
libc = "0.2"
zeroize = "1.8"

[lints.rust]
# Unlike the rest of the workspace this crate needs `unsafe`. `undocumented_unsafe_blocks` below makes every
# block carry a SAFETY note, and `unsafe_op_in_unsafe_fn` keeps each unsafe operation visible.
unsafe_code = "allow"
missing_docs = "warn"
unsafe_op_in_unsafe_fn = "deny"

[lints.clippy]
undocumented_unsafe_blocks = "deny"
unwrap_used = "deny"
expect_used = "deny"
indexing_slicing = "deny"
panic = "deny"
