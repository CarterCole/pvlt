[package]
name = "pvlt-server"
description = "The pvlt server and command: TLS 1.3 listeners, an OPV-compatible API, and unseal and seal."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
keywords.workspace = true
categories = ["web-programming::http-server", "cryptography"]
readme = "README.md"

[[bin]]
name = "pvlt"
path = "src/main.rs"

[features]
default = []
# Conveniences that must never be in a production build (docs/DECISIONS.md, "Staging versus production"): a
# plaintext listener, a local-directory object store, tokens read from environment variables, and the
# passphrase seal mode. Off by default; the release image never turns it on.
dev-insecure = ["pvlt-core/dev-insecure", "pvlt-store/dev-insecure"]

[dependencies]
axum = { version = "0.8", default-features = false, features = ["http1", "http2", "tokio", "json", "query"] }
age = { version = "0.12", default-features = false }
base64 = "0.22"
futures-util = { version = "0.3", default-features = false, features = ["std"] }
getrandom = "0.4"
hex = "0.4"
http-body-util = "0.1"
hyper = "1"
hyper-util = { version = "0.1", features = ["tokio", "server-auto", "service"] }
pvlt-core = { path = "../pvlt-core", version = "0.1.0" }
pvlt-format = { path = "../pvlt-format", version = "0.1.0" }
pvlt-mem = { path = "../pvlt-mem", version = "0.1.0" }
pvlt-objects = { path = "../pvlt-objects", version = "0.1.0" }
pvlt-store = { path = "../pvlt-store", version = "0.1.0" }
pvlt-tokens = { path = "../pvlt-tokens", version = "0.1.0" }
reqwest = { version = "0.13", default-features = false, features = ["rustls"] }
rustls = { version = "0.23", default-features = false, features = ["aws-lc-rs", "std"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.11"
subtle = "2.6"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "net", "signal", "sync", "time"] }
tokio-rustls = { version = "0.26", default-features = false, features = ["aws-lc-rs"] }
tower = { version = "0.5", features = ["util"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
uuid = { version = "1", features = ["serde"] }
zeroize = "1.8"
time = { version = "0.3", default-features = false, features = ["std"] }

[dev-dependencies]
sqlx = { version = "0.9", default-features = false, features = ["runtime-tokio", "postgres"] }
rcgen = "0.14"
reqwest = { version = "0.13", default-features = false, features = ["rustls", "json"] }

[lints]
workspace = true
